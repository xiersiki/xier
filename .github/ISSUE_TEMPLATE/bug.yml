name: 缺陷报告
description: 提供最小复现与预期行为
title: "[Bug] "
body:
  - type: textarea
    id: reproduction
    attributes:
      label: 复现步骤
      description: 不要上传 Key、个人聊天或完整配置。
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: 实际结果与预期结果
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 环境与版本
      placeholder: "macOS / arm64 / v1.0.0 或提交 SHA"
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 脱敏日志或截图
