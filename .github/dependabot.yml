version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      actions-monthly:
        applies-to: version-updates
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      app-monthly:
        applies-to: version-updates
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /site
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      site-monthly:
        applies-to: version-updates
        patterns: ["*"]
