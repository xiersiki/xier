name: Draft test release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version in package.json (without v); creates an unsigned draft prerelease
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - id: version
        name: Validate version and prevent overwriting releases
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'JS'
          import { readFileSync, appendFileSync } from 'node:fs';
          const version = JSON.parse(readFileSync('package.json', 'utf8')).version;
          if (!/^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$/.test(version) || process.env.RELEASE_VERSION !== version) {
            throw new Error('Release version must exactly match package.json');
          }
          appendFileSync(process.env.GITHUB_OUTPUT, `tag=v${version}\n`);
          JS
          TAG="v$RELEASE_VERSION"
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" >/dev/null 2>&1; then
            echo 'Tag already exists; inspect the previous release instead of overwriting it.' >&2
            exit 1
          fi
      - run: npm ci
      - run: npm run check
      - run: npm run build
  builds:
    needs: verify
    uses: ./.github/workflows/desktop.yml
  publish:
    needs: [verify, builds]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: desktop-*
          path: artifacts
      - name: Assemble immutable release assets
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, shutil, json, os, re
          destination = Path('release-assets')
          destination.mkdir()
          files = sorted(p for p in Path('artifacts').rglob('*') if p.is_file())
          if not files:
              raise SystemExit('No desktop artifacts downloaded')
          for p in files:
              target = destination / re.sub(r'[^A-Za-z0-9._-]', '.', p.name)
              if target.exists():
                  raise SystemExit(f'Duplicate artifact filename: {p.name}')
              shutil.copyfile(p, target)
          provenance = {'commit': os.environ['GITHUB_SHA'], 'repository': os.environ['GITHUB_REPOSITORY'], 'run': os.environ['GITHUB_RUN_ID'], 'signed': False, 'installation_verified': False}
          (destination / 'build-info.json').write_text(json.dumps(provenance, indent=2) + '\n')
          sums = [f'{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.name}' for p in sorted(destination.iterdir())]
          (destination / 'SHA256SUMS.txt').write_text('\n'.join(sums) + '\n')
          PY
      - name: Create draft prerelease at this exact commit
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.verify.outputs.tag }}
        run: |
          cat > release-notes.md <<'NOTES'
          未签名测试构建。Forge 已完成 macOS arm64、Windows x64、Linux x64 构建；构建成功不代表安装/启动验收完成。

          发布前由维护者下载并核对 SHA256SUMS.txt，补充操作系统、安装/启动结果及已知限制，再将草稿公开为 prerelease。
          此版本未配置 macOS 签名/公证或 Windows 代码签名；不应标为稳定发行版。
          NOTES
          gh release create "$RELEASE_TAG" release-assets/* \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Xier $RELEASE_TAG · 测试构建" \
            --draft --prerelease --notes-file release-notes.md
