name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: Application checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
  spec:
    name: OpenSpec and TDD
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      OPENSPEC_TELEMETRY: '0'
      OPENSPEC_NO_UPDATE_CHECK: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run spec:validate
      - name: Check changed scope and delivery evidence
        env:
          SPEC_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$SPEC_BASE" ]; then
            SPEC_BASE="$(git rev-parse HEAD^)"
          fi
          npm run spec:gate -- --base "$SPEC_BASE"
      - name: Record validation boundary
        run: |
          echo 'OpenSpec syntax, completed tasks and delivery evidence passed. Current tests run in Application checks. Review the saved logs and PR commits for historical red/green order.' >> "$GITHUB_STEP_SUMMARY"
  site:
    name: Site checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci --prefix site
      - run: npm run site:build
  desktop:
    name: Desktop
    uses: ./.github/workflows/desktop.yml
  required:
    name: required
    if: ${{ always() }}
    needs: [app, spec, site, desktop]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every check to succeed
        env:
          APP: ${{ needs.app.result }}
          SPEC: ${{ needs.spec.result }}
          SITE: ${{ needs.site.result }}
          DESKTOP: ${{ needs.desktop.result }}
        run: |
          test "$APP" = success
          test "$SPEC" = success
          test "$SITE" = success
          test "$DESKTOP" = success
