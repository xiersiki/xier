name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    name: Changed scope
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      app: ${{ steps.select.outputs.app }}
      site: ${{ steps.select.outputs.site }}
      desktop: ${{ steps.select.outputs.desktop }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - id: select
        env:
          CI_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          FORCE_FULL: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'ci:full') }}
        run: |
          if [ -z "$CI_BASE" ]; then CI_BASE="$(git rev-parse HEAD^)"; fi
          args=(--base "$CI_BASE")
          if [ "$FORCE_FULL" = true ]; then args+=(--full); fi
          node scripts/ci-scope.mjs "${args[@]}" > "$RUNNER_TEMP/ci-scope.json"
          node --input-type=module <<'JS'
          import { readFileSync, appendFileSync } from 'node:fs';
          const scope = JSON.parse(readFileSync(`${process.env.RUNNER_TEMP}/ci-scope.json`, 'utf8'));
          for (const job of ['app', 'site', 'desktop']) {
            if (typeof scope[job] !== 'boolean') throw new Error(`Invalid scope: ${job}`);
            appendFileSync(process.env.GITHUB_OUTPUT, `${job}=${scope[job]}\n`);
          }
          appendFileSync(process.env.GITHUB_STEP_SUMMARY, `OpenSpec always runs. Selected checks: ${JSON.stringify(scope)}\n`);
          JS
  app:
    needs: scope
    if: ${{ needs.scope.outputs.app == 'true' }}
    name: Application checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
  spec:
    name: OpenSpec and TDD
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      OPENSPEC_TELEMETRY: '0'
      OPENSPEC_NO_UPDATE_CHECK: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run spec:validate
      - name: Check changed scope and delivery evidence
        env:
          SPEC_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$SPEC_BASE" ]; then
            SPEC_BASE="$(git rev-parse HEAD^)"
          fi
          npm run spec:gate -- --base "$SPEC_BASE"
      - name: Record validation boundary
        run: |
          echo 'OpenSpec syntax, completed tasks and delivery evidence passed. Current tests run in Application checks. Review the saved logs and PR commits for historical red/green order.' >> "$GITHUB_STEP_SUMMARY"
  site:
    needs: scope
    if: ${{ needs.scope.outputs.site == 'true' }}
    name: Site checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci --prefix site
      - run: npm run site:build
  desktop:
    needs: scope
    if: ${{ needs.scope.outputs.desktop == 'true' }}
    name: Desktop
    uses: ./.github/workflows/desktop.yml
  required:
    name: required
    if: ${{ always() }}
    needs: [scope, app, spec, site, desktop]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Require selected checks to succeed
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: node scripts/check-ci-results.mjs
